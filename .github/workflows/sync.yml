name: Sync Art Gallery

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: sync # <-- Added to access environment-scoped secrets

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure gallery.json exists
        run: |
          if [ ! -f gallery.json ]; then
            echo "[]" > gallery.json
          fi

      - name: Sync Gallery from Discord
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: node scripts/sync-gallery.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/art/ gallery.json
          git status
          git diff-index --quiet HEAD || (git commit -m "auto: sync new art from Discord" && git push)
